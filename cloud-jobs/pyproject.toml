[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucl-hiking-jobs"
version = "0.1.0"
description = "Cloud Run jobs for UCL Hiking Club"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "suu[forms] @ git+https://github.com/MaybeItsAdam/suu.git@d23e7a4781ff26b40ed192918ae6dee3ba9caad5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hiking-member-sync = "hiking_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
